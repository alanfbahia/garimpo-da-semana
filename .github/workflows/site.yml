name: Update catalog and publish site

on:
  schedule:
    - cron: "23 9 * * *"   # every day 06:23 Brasilia
  push:
    branches: [main]
    paths: ["site/**", "data/mercadolivre.json", "data/shopee.json", "scripts/update_catalog.py", "scripts/build_pages.py", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build catalog
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          TELEGRAM_CHANNEL_URL: ${{ vars.TELEGRAM_CHANNEL_URL || secrets.TELEGRAM_CHANNEL_URL }}
        run: python scripts/update_catalog.py
      - name: Build product pages, feed and sitemap
        run: python scripts/build_pages.py
      - name: Commit catalog
        run: |
          git config user.name "garimpo-bot"
          git config user.email "garimpo-bot@users.noreply.github.com"
          git add site/data/products.json site/p site/feed.xml site/sitemap.xml
          git diff --cached --quiet || (git commit -m "Update catalog" && git pull --rebase && git push)

  deploy:
    needs: catalog
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
