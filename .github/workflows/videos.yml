name: Build short videos

on:
  schedule:
    - cron: "41 10 * * 1"  # Mondays 07:41 Brasilia, after the weekly catalog refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q pillow
      - name: Render videos
        run: python scripts/make_videos.py
      - name: Commit videos
        run: |
          git config user.name "garimpo-bot"
          git config user.email "garimpo-bot@users.noreply.github.com"
          git add -A media
          git diff --cached --quiet || (git commit -m "Weekly short videos" && git pull --rebase && git push)
